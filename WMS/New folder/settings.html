<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F8FAFC;--card:#FFF;--sidebar:#FFF;--text:#111827;--muted:#6B7280;
  --border:#E5E7EB;--primary:#2563EB;--danger:#DC2626;
  --glass:rgba(17,24,39,.04);--radius:12px;--shadow:0 6px 18px rgba(16,24,40,.06)
}
[data-theme="dark"]{
  --bg:#0D1117;--card:#161B22;--sidebar:#0B1220;--text:#F9FAFB;
  --muted:#9CA3AF;--border:#1E293B;--primary:#60A5FA;
  --danger:#EF4444;--glass:rgba(255,255,255,.03);
  --shadow:0 8px 20px rgba(2,6,23,.6)
}
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:64px;background:var(--sidebar);border-right:1px solid var(--border);
display:flex;flex-direction:column;align-items:center;padding:12px 8px}
.icon-btn{width:48px;height:48px;border-radius:10px;display:flex;
align-items:center;justify-content:center;color:var(--muted);text-decoration:none}
.icon-btn.active{background:linear-gradient(180deg,var(--primary),#2b6edc);color:#fff}
.main{flex:1;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;justify-content:space-between;align-items:center;
padding:0 24px;border-bottom:1px solid var(--border)}
.content{flex:1;display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px}
.card{background:var(--card);border-radius:12px;padding:16px;
border:1px solid var(--border);box-shadow:var(--shadow)}
.input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border)}
.btn{background:var(--primary);color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.danger{background:var(--danger)}
.menu a{display:block;padding:10px;border-radius:10px;text-decoration:none;color:var(--text)}
.menu a.active{background:var(--glass)}
</style>
</head>

<body data-theme="light">
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a class="icon-btn" href="index.html">🏠</a>
    <a class="icon-btn" href="inbox.html">💬</a>
    <a class="icon-btn" href="contacts.html">👥</a>
    <a class="icon-btn" href="campaigns.html">📢</a>
    <a class="icon-btn" href="automations.html">🔁</a>
    <a class="icon-btn" href="billing.html">💳</a>
    <a class="icon-btn active" href="settings.html">⚙️</a>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <strong>Settings</strong>
      <button id="themeToggle">🌓</button>
    </header>

    <section class="content">

      <!-- LEFT MENU -->
      <aside class="menu">
        <div class="card">
          <a class="active">Workspace</a>
          <a>Users & Roles</a>
          <a>WhatsApp Accounts</a>
          <a>API Keys</a>
          <a>Integrations</a>
          <a>Security</a>
        </div>
      </aside>

      <!-- RIGHT CONTENT -->
      <section>
        <div class="card">
          <h3>Workspace Settings</h3>

          <label>Workspace Name</label>
          <input class="input" value="Acme Corp"/>

          <label style="margin-top:12px">Timezone</label>
          <select class="input">
            <option>UTC</option>
            <option selected>Asia/Kolkata</option>
            <option>US/Eastern</option>
          </select>

          <label style="margin-top:12px">Default Language</label>
          <select class="input">
            <option>English</option>
            <option>Hindi</option>
          </select>

          <div style="margin-top:16px;display:flex;gap:12px">
            <button class="btn">Save Changes</button>
            <button class="btn danger">Delete Workspace</button>
          </div>
        </div>

        <div class="card">
          <h3>Connected Integrations</h3>
          <p>WhatsApp Business API — Connected</p>
          <p>Shopify — Connected</p>
        </div>
      </section>

    </section>
  </main>
</div>

<script>
document.getElementById('themeToggle').onclick=()=>{
  document.body.dataset.theme =
    document.body.dataset.theme === 'dark' ? 'light' : 'dark';
}
</script>
</body>
</html>
